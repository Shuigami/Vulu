<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121114" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<title>Hors ligne · Vulu</title>
		<style>
			:root {
				--bg: #f7f4ee;
				--ink: #1c1a1f;
				--muted: #6a6470;
				--accent: #f0b44c;
				--on-accent: #1a1407;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #121114;
					--ink: #f2efe9;
					--muted: #a9a3b0;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--ink);
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}
			main {
				max-width: 32rem;
				padding: 2rem 1rem;
			}
			h1 {
				margin: 0.5rem 0;
				font-size: 2.5rem;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0 0 1.25rem;
			}
			.muted {
				color: var(--muted);
				margin: 0;
			}
			button {
				border: 0;
				border-radius: 999px;
				padding: 0.7rem 1.5rem;
				background: var(--accent);
				color: var(--on-accent);
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="muted">Vulu</p>
			<h1>Hors ligne</h1>
			<p>Cette page a besoin d’une connexion. Vérifie ton réseau, puis réessaie.</p>
			<button type="button" onclick="location.reload()">Réessayer</button>
		</main>
	</body>
</html>
