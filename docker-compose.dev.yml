# Development database only: the app and the worker run on the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulu
      POSTGRES_PASSWORD: vulu
      POSTGRES_DB: vulu
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vulu -d vulu']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
