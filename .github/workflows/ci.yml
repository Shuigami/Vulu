name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulu
          POSTGRES_PASSWORD: vulu
          POSTGRES_DB: vulu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulu -d vulu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://vulu:vulu@localhost:5432/vulu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: Apply migrations to the empty database
        run: pnpm db:migrate
      - name: Fail if the schema and the migrations disagree
        run: pnpm exec drizzle-kit check && pnpm exec drizzle-kit generate && test -z "$(git status --porcelain drizzle)"
      - run: pnpm test
